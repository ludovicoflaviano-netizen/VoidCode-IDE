<!doctype html><html><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self';style-src 'self' 'unsafe-inline';script-src 'self' 'unsafe-inline'"><title>VoidCode IDE</title><link rel="stylesheet" href="style.css"></head><body><div class="titlebar"><div class="brand"><span class="logo">V</span><b>VoidCode</b><span class="tag">IDE</span></div><div class="quick"><button id="newBtn">＋ New</button><button id="openBtn">Open</button><button id="saveBtn">Save</button><button id="runBtn" class="primary">▶ Run</button><button id="buildBtn">⚙ Build EXE</button></div><div class="windowBtns">—　□　×</div></div><div class="layout"><aside class="activity"><button class="active">▣</button><button>⌕</button><button>⑂</button><button>◈</button><div class="spacer"></div><button id="themeBtn">☾</button><button id="settingsBtn">⚙</button></aside><aside class="sidebar"><div class="sidehead"><b id="sideTitle">EXPLORER</b><button id="folderBtn">＋</button></div><div id="tree" class="tree"><div class="empty">Open a folder to start</div></div></aside><main class="main"><div id="tabs" class="tabs"></div><div class="crumbs" id="crumbs">Welcome</div><div class="editorWrap"><div class="gutter" id="gutter"></div><textarea id="editor" spellcheck="false" placeholder="Open a file or create a new one..."></textarea></div><div class="bottom"><div class="bottomTabs"><button class="bt active" data-bottom="terminal">TERMINAL</button><button class="bt" data-bottom="problems">PROBLEMS <i id="problemCount">0</i></button><button class="bt" data-bottom="output">OUTPUT</button></div><div id="terminal" class="panel"><div class="termline">VoidCode Terminal <span>• Windows</span></div><div id="termout"></div><div class="prompt"><span>›</span><input id="cmd" placeholder="Run a command..." autocomplete="off"></div></div><div id="problems" class="panel hidden">No problems detected.</div><div id="output" class="panel hidden">Build and run output will appear here.</div></div></ma
